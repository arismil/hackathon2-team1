[project]
name = "hackathon2-team1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aris Miletis", email = "arismiletis@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.3",
    "pydantic>=2.12",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
hackathon2-team1 = "hackathon2_team1:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
